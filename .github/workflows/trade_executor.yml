name: Execute Trades

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install ccxt pandas joblib numpy
      
      - name: Run Risk Manager
        run: python risk_manager.py
      
      - name: Execute Trades
        env:
          KUCOIN_API_KEY: ${{ secrets.KUCOIN_API_KEY }}
          KUCOIN_API_SECRET: ${{ secrets.KUCOIN_API_SECRET }}
        run: python trade_executor.py
      
      - name: Log Results
        run: |
          echo "Trade executed at $(date)" >> trade_log.txt
          cat trade_log.txt
