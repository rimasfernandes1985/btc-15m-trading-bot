name: BTC Data Collector

on:
  workflow_dispatch:  # Permite execução manual
  schedule:
    - cron: '*/15 * * * *'  # Executa a cada 15 minutos

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Importante para o histórico de commits

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas ta numpy

      - name: Run data collector
        run: python data_collector.py

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Adiciona apenas arquivos que existem
          [ -f btc_data.csv ] && git add btc_data.csv
          [ -f ml_ready_data.csv ] && git add ml_ready_data.csv
          [ -f error_log.txt ] && git add error_log.txt
          
          # Verifica se há alterações para commitar
          if git diff-index --quiet HEAD; then
            echo "Sem alterações para commitar."
          else
            git commit -m "Update BTC data [skip ci]"
            git push origin HEAD:main
          fi
