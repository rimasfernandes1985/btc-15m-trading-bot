name: BTC Data Collector
on:
  workflow_dispatch:  # Permite execução manual
  schedule:
    - cron: '*/15 * * * *'  # Executa a cada 15 minutos

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:  # Adicionei permissões explícitas
      contents: write  # Permite push no repositório

    steps:
      - uses: actions/checkout@v4  # Baixa o código

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install ccxt pandas

      - name: Run data collector
        run: python data_collector.py

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Token de autenticação
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add btc_data.csv
          git commit -m "Update BTC data [skip ci]"
          git pull --rebase  # Evita conflitos
          git push origin HEAD:main
