name: BTC Data Collector
on:
  workflow_dispatch:  # Permite execução manual
  schedule:
    - cron: '*/15 * * * *'  # Executa a cada 15 minutos

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permite escrever no repositório
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Busca todo o histórico para evitar conflitos

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install ccxt==4.4.99
          pip install pandas==2.2.2
          pip install python-dotenv==1.0.1
          pip install requests==2.32.4
          pip install ta==0.11.0

      - name: Run data collector
        env:
          KUCOIN_API_KEY: ${{ secrets.KUCOIN_API_KEY }}
          KUCOIN_SECRET: ${{ secrets.KUCOIN_SECRET }}
          KUCOIN_PASSPHRASE: ${{ secrets.KUCOIN_PASSPHRASE }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python data_collector.py

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Commit and push changes
        run: |
          # Adiciona apenas o arquivo de dados
          git add btc_data.csv
          
          # Faz o commit apenas se houver mudanças
          git diff --staged --quiet || git commit -m "Update BTC data [skip ci]"
          
          # Faz o push forçado para evitar conflitos
          git push origin HEAD:main
