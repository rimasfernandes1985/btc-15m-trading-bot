name: BTC Data Collector

on:
  workflow_dispatch:  # Permite execução manual
  schedule:
    - cron: '*/15 * * * *'  # A cada 15 minutos

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install ccxt pandas ta numpy  # ATUALIZADO: adicionado 'ta' e 'numpy'
        
      - name: Run data collector
        run: python data_collector.py
        
      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add btc_data.csv
          git add ml_ready_data.csv  # NOVO: adiciona o arquivo de dados processados
          git add error_log.txt  # NOVO: adiciona o log de erros se existir
          git commit -m "Update BTC data [skip ci]"
          git push
