name: BTC Data Collector
on:
  workflow_dispatch:  # Permite execução manual
  schedule:
    - cron: '*/15 * * * *'  # Executa a cada 15 minutos

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permite escrever no repositório
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install ccxt==4.4.99
          pip install pandas==2.2.2
          pip install python-dotenv==1.0.1
          pip install requests==2.32.4
          pip install ta==0.11.0
          pip install joblib==1.4.2  # Adicionando joblib explicitamente

      - name: Run data collector
        env:
          KUCOIN_API_KEY: ${{ secrets.KUCOIN_API_KEY }}
          KUCOIN_SECRET: ${{ secrets.KUCOIN_SECRET }}
          KUCOIN_PASSPHRASE: ${{ secrets.KUCOIN_PASSPHRASE }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python data_collector.py

      - name: Commit and push data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add btc_data.csv
          git commit -m "Update BTC data [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
