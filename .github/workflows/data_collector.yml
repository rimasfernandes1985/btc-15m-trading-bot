name: BTC Data Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install ccxt pandas ta numpy  # CORRIGIDO: "ccxt" em vez de "cost"
        
      - name: Run data collector
        run: python data_collector.py
        
      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Adiciona apenas arquivos que existem
          [ -f btc_data.csv ] && git add btc_data.csv
          [ -f ml_ready_data.csv ] && git add ml_ready_data.csv
          [ -f error_log.txt ] && git add error_log.txt
          
          # Comita apenas se houver alterações
          git diff-index --quiet HEAD || git commit -m "Update BTC data [skip ci]"
          git push
