name: ML Model Trainer
on:
  workflow_dispatch:  # Execução manual
  schedule:
    - cron: '0 18 * * 1-5'  # Diariamente às 15h BRT (18h UTC)

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install pandas scikit-learn joblib numpy
          pip install ta  # Para pré-processamento
          
      - name: Run data preprocessing
        run: python data_preprocessor.py
        
      - name: Train ML model
        run: python ml_trainer.py
        
      - name: Commit updated model
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "ML Trainer"
          git add trading_model.pkl
          git diff --staged --quiet || git commit -m "[Automated] Update trading model"
          git push origin HEAD:main
