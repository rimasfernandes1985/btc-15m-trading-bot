name: Model Trainer

on:
  workflow_dispatch:  # Permite execução manual
  schedule:
    - cron: '0 0 * * 0'  # Toda domingo à 00:00 (meia-noite)

permissions:
  contents: write  # Permite fazer push

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Importante para histórico completo

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python ml_trainer.py

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add trading_model.pkl
          git add model_metadata.txt
          if git diff-index --quiet HEAD; then
            echo "Nenhuma alteração para commitar"
          else
            git commit -m "Update trading model [skip ci]"
            git push
          fi
